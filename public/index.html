<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Theme -->
    <meta name="theme-color" content="#043082" />

    <!-- SEO Title -->
    <title>Sowbharani Ganesan | AI & ML Engineer </title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Professional portfolio of Sowbharani Ganesan - AI & ML Engineer specializing in Data Science, Power BI, Machine Learning and Deep Learning. "
    />

    <meta
      name="keywords"
      content="Sowbharani Ganesan, AI & ML Engineer, Data Science, Power BI, Machine Learning, Deep Learning"
    />

    <meta name="author" content="Sowbharani Ganesan" />

    <!-- Canonical -->
    <link rel="canonical" href="https://sowbharani-portfolio.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (LinkedIn / WhatsApp / Facebook / Discord / Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sowbharani Portfolio" />

    <meta
      property="og:title"
      content="Sowbharani Ganesan | AI & ML Engineer"
    />

    <meta
      property="og:description"
      content="Explore my portfolio featuring AI projects, technical skills, and modern AI development expertise."
    />

    <meta
      property="og:url"
      content="https://sowbharani-portfolio.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://sowbharani-portfolio.vercel.app/preview.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Sowbharani Ganesan Portfolio Preview"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Sowbharani Ganesan | AI & ML Engineer"
    />

    <meta
      name="twitter:description"
      content="Explore my portfolio featuring AI projects, technical skills, and modern AI development expertise."
    />

    <meta
      name="twitter:image"
      content="https://sowbharani-portfolio.vercel.app/preview.png"
    />
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div id="root"></div>
  </body>
</html>
